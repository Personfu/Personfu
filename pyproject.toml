[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personfu-arcade"
version = "1.0.0"
description = "Dependency-free terminal games with cleanly separated, unit-tested engines."
readme = "games/README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["games", "terminal", "curses", "snake", "minesweeper"]

[project.scripts]
personfu-arcade = "games.__main__:main"

[tool.setuptools]
packages = ["games", "games.core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
